name: Football Flutter checks

on:
  push:
    branches:
      - feature/football-center-phase1
    paths:
      - "lib/core_bridge.dart"
      - "lib/football_models.dart"
      - "lib/ui/football/**"
      - "lib/playback_session.dart"
      - "lib/ui/player/**"
      - "lib/ui/mine/mine_page.dart"
      - "lib/ui/explore/explore_page.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/football-flutter-check.yml"

permissions:
  contents: read

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Temporary format diagnostics
        run: |
          dart format --output=write lib/core_bridge.dart lib/football_models.dart lib/playback_session.dart lib/ui/football lib/ui/player/playback_handle.dart lib/ui/player/player_page.dart lib/ui/player/landscape_player_page.dart lib/ui/player/portrait_player_page.dart lib/ui/mine/mine_page.dart lib/ui/explore/explore_page.dart
          git diff -- lib/playback_session.dart
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib/core_bridge.dart lib/football_models.dart lib/playback_session.dart lib/ui/football lib/ui/player/playback_handle.dart lib/ui/player/player_page.dart lib/ui/player/landscape_player_page.dart lib/ui/player/portrait_player_page.dart lib/ui/mine/mine_page.dart lib/ui/explore/explore_page.dart
      - name: Analyze football integration
        run: dart analyze lib/core_bridge.dart lib/football_models.dart lib/playback_session.dart lib/ui/football lib/ui/player/playback_handle.dart lib/ui/player/player_page.dart lib/ui/player/landscape_player_page.dart lib/ui/player/portrait_player_page.dart lib/ui/mine/mine_page.dart lib/ui/explore/explore_page.dart
